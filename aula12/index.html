<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark">
    <header class="py-3 text-center bg-black text-white">
        <h1>Formulários</h1>
    </header>
    <main class="container mt-5">
        <section class="row">

            <div class="col-12 col-md-6">
                <h2 class="text-light">Cadastro de cliente</h2>
                <form class="d-flex flex-column gap-2 border rounded-3 p-3 bg-light mb-5">
                    <label for="nome">Nome:</label>
                    <input class="form-control rounded-3" required id="nome" type="text" maxlength="40"
                        placeholder="Digite seu nome...">
                    <label for="telefone">Telefone:</label>
                    <input class="rounded-3" type="text" maxlength="15" placeholder="(XX) XXXXX-XXXX">
                    <label for="estado">Selecione o estado:</label>
                    <select class="rounded-3" name="estado" id="estado">
                        <option value="">RS</option>
                        <option value="" selected>SC</option>
                        <option value="" disabled>PR</option>
                    </select>
                    <label for="dataNasc">Data de Nascimento</label>
                    <input class="rounded-3" id="dataNasc" type="date" placeholder="dd/mm/aaaa" max="2025-05-22" min="1900-01-01">

                    <label>Informe o sexo:</label>
                    <div>
                        <input type="radio" name="sex" id="">Masculino
                        <input type="radio" name="sex" id="">Feminino
                    </div>
                    <label>Selecione as disciplinas:</label>
                    <div>
                        <p><input type="checkbox" name="disc" id="">Front-end</p>
                        <p><input type="checkbox" name="disc" id="">Back-end</p>
                        <p><input type="checkbox" name="disc" id="">Lógica de Programação</p>
                    </div>

                    <!-- <input type="button" value="Salvar"> -->
                    <button type="button" class="rounded-3">Salvar</button>
                    <button type="reset" class="rounded-3">Cancelar</button>
                </form>
            </div>

            <div class="col-12 col-md-6">
                <h2 class="text-light">Formulário de Login</h2>
                <form class="border rounded-3 p-3 bg-light">
                    <div class="mb-3 mt-3">
                        <label for="email" class="form-label">Email:</label>
                        <input type="email" class="form-control" id="email" placeholder="Informe seu email..."
                            name="email">
                    </div>
                    <div class="mb-3">
                        <label for="pwd" class="form-label">Senha:</label>
                        <input type="password" class="form-control" id="pwd" placeholder="Informe sua senha..."
                            name="pswd">
                    </div>
                    <div class="form-check mb-3">
                        <label class="form-check-label">
                            <input class="form-check-input" type="checkbox" name="remember"> Lembrar me
                        </label>
                    </div>
                    <button type="button" class="btn btn-primary w-100">Logar</button>
                </form>
            </div>

        </section>



    </main>
</body>

</html>
