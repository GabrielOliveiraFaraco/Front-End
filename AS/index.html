<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>Lista de Tarefas</title>
</head>

<body>

    <header class="header">
        <h1 href="index.html" class="nav-link title">Lista de Tarefas</h1>
    </header>

    <main>
        <h2 class="sub-title">Adicionar Tarefa</h2>
        <div class="d-flex align-items-center justify-content-center">
            <input id="tarefa" type="text" placeholder="Digit o nome da tarefa">
            <div class="dropdown">
                <button type="button" class="dropdown-toggle" data-bs-toggle="dropdown">
                    Prioridade
                </button>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item btn baixa" id="baixa" onclick="definirPrioridade(event)">Baixa</a></li>
                    <li><a class="dropdown-item btn media" id="media" onclick="definirPrioridade(event)">Média</a></li>
                    <li><a class="dropdown-item btn alta" id="alta" onclick="definirPrioridade(event)">Alta</a></li>
                </ul>
            </div>
            <button class="btn border p-1" onclick="adicionarTarefa()">Adicionar</button>
        </div>
        <div class="tarefas d-flex mt-4">
            <div class="card-lista">
                <h2 class="card-title text-center">Tarefas Pendentes</h2>
                <div class="d-flex justify-content-around">
                    <button class="btn" onclick="ordenarPendentesPorPrioridade()">Ordenar por Prioridade</button>
                    <button class="btn" onclick="ordenarPendentesPorData()">Ordenar por Data</button>
                </div>
                <ol class="lista-tarefas" id="listaTarefas"></ol>
            </div>
            <div class="card-lista">
                <h2 class="card-title text-center">Tarefas Concluídas</h2>
                <div class="d-flex justify-content-around">
                    <button class="btn" onclick="ordenarConcluidasPorPrioridade()">Ordenar por Prioridade</button>
                    <button class="btn" onclick="ordenarConcluidasPorData()">Ordenar por Data</button>
                </div>
                <ol class="lista-tarefas" id="tarefasConcluidas"></ol>
            </divclass>
        </div>
    </main>

    <footer class="footer mt-auto">
        <div class="container text-center">
            <p>&copy; Gabriel Oliveira Faraco</p>
            <p>Todos os direitos reservados.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
